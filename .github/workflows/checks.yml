name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: sh -n scripts/check-system.sh templates/00-local-secure-boot-lockdown templates/local-secure-boot-tools templates/local-secure-boot-hook
